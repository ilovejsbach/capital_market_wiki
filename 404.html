<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>찾을 수 없는 페이지</title><style>body{font:16px/1.6 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;margin:0;padding:2rem 1rem;background:#fff;color:#222}main{max-width:36rem;margin:0 auto}a{color:#2b6cb0}@media (prefers-color-scheme:dark){body{background:#161618;color:#e6e6e6}a{color:#7fb2ff}}</style></head>
<body><main>
<h1>찾을 수 없는 페이지</h1>
<p id="msg">요청한 주소에 문서가 없습니다.</p>
<p><a id="home" href="./">홈으로</a></p>
<p>홈의 검색에서 문서 이름으로 찾아보세요.</p>
</main>
<script>
(function(){
  var parts = decodeURI(location.pathname).split("/").filter(Boolean), home = document.getElementById("home");
  var isId = parts.indexOf("id") !== -1;
  if (isId) document.getElementById("msg").textContent = "삭제되었거나 게시되지 않은 문서입니다. 주소가 잘못되었거나 아직 없는 문서입니다.";
  (function probe(n){
    if (n < 0) return;
    var base = "/" + parts.slice(0, n).join("/") + (n ? "/" : "");
    fetch(base + "ids.json", {method: "HEAD"}).then(function(r){
      if (r.ok) { home.href = base; } else { probe(n - 1); }
    }).catch(function(){ probe(n - 1); });
  })(parts.length);
})();
</script></body></html>
